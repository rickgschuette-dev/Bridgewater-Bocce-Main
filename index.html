.home-media-section {
margin: 8px 0 40px;
}

.home-media-section .photo-carousel {
margin: 0 auto 28px;

.photo-carousel {
position: relative;
width: 100%;
aspect-ratio: 9 / 16;
overflow: hidden;
border-radius: 8px;
border: 1px solid var(--border-light);
background: #142850;
}

.carousel-slide {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
object-fit: cover;
opacity: 0;
transition: opacity 0.6s ease;
}

.carousel-slide.active {
opacity: 1;
}

.carousel-arrow {
position: absolute;
top: 50%;
transform: translateY(-50%);
background: rgba(20, 40, 80, 0.55);
color: #fff;
border: none;
width: 34px;
height: 34px;
border-radius: 50%;
font-size: 20px;
line-height: 1;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
}

.carousel-arrow:hover {
background: rgba(20, 40, 80, 0.85);
}

.carousel-prev {
left: 8px;
}

.carousel-next {
right: 8px;
}

.carousel-dots {
position: absolute;
bottom: 10px;
left: 0;
right: 0;
display: flex;
justify-content: center;
gap: 6px;
flex-wrap: wrap;
padding: 0 8px;
}

.carousel-dot {
width: 9px;
height: 9px;
border-radius: 50%;
background: rgba(255, 255, 255, 0.55);
border: none;
padding: 0;
cursor: pointer;
}

.carousel-dot.active {
background: #fff;
}

.video-player-box {
position: relative;
width: 100%;
aspect-ratio: 16 / 9;
overflow: hidden;
border-radius: 8px;
border: 1px solid var(--border-light);
background: var(--brand-blue-dark);
display: flex;
align-items: center;
justify-content: center;
text-align: center;
padding: 20px;
}

.video-player-placeholder {

color: rgba(255, 255, 255, 0.85);

<script>
(function () {
var carousel = document.getElementById('photo-carousel');
if (!carousel) return;
var slides = carousel.querySelectorAll('.carousel-slide');
var dots = carousel.querySelectorAll('.carousel-dot');
var current = 0;
var timer;

function showSlide(index) {
slides[current].classList.remove('active');
dots[current].classList.remove('active');
current = (index + slides.length) % slides.length;
slides[current].classList.add('active');
dots[current].classList.add('active');
}

function nextSlide() {
showSlide(current + 1);
}

function prevSlide() {
showSlide(current - 1);
}

function startAutoRotate() {
stopAutoRotate();
timer = setInterval(nextSlide, 5000);
}

function stopAutoRotate() {
if (timer) {
clearInterval(timer);
}
}

carousel.querySelector('.carousel-next').addEventListener('click', function () {
nextSlide();
startAutoRotate();
});

carousel.querySelector('.carousel-prev').addEventListener('click', function () {
prevSlide();
startAutoRotate();
});

dots.forEach(function (dot, i) {
dot.addEventListener('click', function () {
showSlide(i);
startAutoRotate();
});
});

carousel.addEventListener('mouseenter', stopAutoRotate);
carousel.addEventListener('mouseleave', startAutoRotate);

startAutoRotate();
})();
</script>
